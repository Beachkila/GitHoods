<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GitHoods</title>
<meta name="description" content="Turns a GitHub repository into a town map. Folders become districts, files become buildings, imports become streets.">
<style>
:root{--bg:#F3EAD7;--panel:#FBF6EC;--ink:#3B2A1A;--soft:#7A6650;--line:#D9C9AB;--accent:#C8643B;--accent2:#5E9E8A;--input:#FFFDF8;--err:#A63D2A;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1A15;--panel:#29221B;--ink:#EFE4D0;--soft:#B5A58C;--line:#43382C;--input:#211B15;--err:#F08A72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F1A15;--panel:#29221B;--ink:#EFE4D0;--soft:#B5A58C;--line:#43382C;--input:#211B15;--err:#F08A72;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px;margin-right:4px}
.brand span{color:var(--accent)}
#form{display:flex;gap:6px;flex:1 1 260px;min-width:0}
#q{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink);font:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.6;cursor:wait}
.ghost{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
#progress{font-size:13px;color:var(--soft);min-height:1em;flex:1 1 200px}
#progress.err{color:var(--err)} #progress.ok{color:var(--accent2)}
#progress.busy::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;animation:p 1s infinite}
@keyframes p{50%{opacity:.2}}
#crumbs{display:none;gap:6px;align-items:center}
#crumbs button{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
#crumbs i{color:var(--soft);font-style:normal}
body[data-tab="world"] #crumbs{display:flex} body[data-tab="world"] #modes{display:none}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.stage{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#world-canvas{display:none} body[data-tab="world"] #world-canvas{display:block} body[data-tab="world"] #town-canvas{display:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid #CDBB98;background:#FBF6EC;color:#3B2A1A;font-size:16px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px 24px}
aside h2{font-size:17px;margin:0 0 4px;word-break:break-word} aside h2 a{color:inherit}
aside h3{font-size:13px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.4px;color:var(--soft)}
aside h3 small{text-transform:none;letter-spacing:0;font-weight:400;display:block}
aside h4{margin:0 0 4px;font-size:15px;word-break:break-word}
.arch{margin:0 0 6px} .desc{margin:0 0 8px;color:var(--soft)}
.muted{color:var(--soft)} .note{font-size:12px;color:var(--soft);border-left:3px solid var(--line);padding-left:8px}
.path{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--soft);word-break:break-all;margin:0 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stats.small{grid-template-columns:repeat(2,1fr)}
.stats div{background:var(--bg);border-radius:6px;padding:5px 8px} .stats dt{font-size:11px;color:var(--soft)} .stats dd{margin:0;font-weight:600}
.langbar{display:flex;height:10px;border-radius:5px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
.langkey{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:4px;color:var(--soft)}
.langkey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;border:1px solid #0002}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.list li b{white-space:nowrap;flex:none}
.list li span,.list li button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list em{font-style:normal;font-size:11px;color:var(--accent);margin-left:4px}
.link{border:0;background:none;padding:0;color:var(--accent);text-align:left}
#inspector{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px;background:var(--bg);min-height:62px}
#inspector p{margin:2px 0}
aside a{color:var(--accent)} aside a.btn{color:#fff}
.shelf-wrap{padding:6px 16px 10px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:8px;align-items:center;overflow-x:auto}
.shelf-wrap b{font-size:12px;color:var(--soft);white-space:nowrap}
#shelf{display:flex;gap:6px}
#shelf button.mine{border-style:dashed}
.pub{margin:10px 0 0;font-size:13px;color:var(--accent2);font-weight:600}.pub.local{color:var(--soft);font-weight:400;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn.small{padding:5px 10px;font-size:13px;text-decoration:none;display:inline-block}
.small{font-size:12px}
#shelf button{white-space:nowrap;border:1px solid var(--line);background:var(--input);border-radius:999px;padding:3px 10px;font-size:12px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:min(460px,92vw)}
dialog input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink);font:inherit}
dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:12px 0 0;flex-wrap:wrap}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  body{height:auto;min-height:100%} html{height:auto}
}
</style>
</head>
<body data-tab="town">
<header>
  <div class="brand">Git<span>Hoods</span></div>
  <form id="form" autocomplete="off"><input id="q" placeholder="owner/repo, a GitHub link, or an owner" aria-label="Repository or owner" spellcheck="false" autocapitalize="off"><button class="btn" id="scan" type="submit">Scan</button><button class="ghost" id="gear" type="button" title="Settings" aria-label="Settings">⚙</button></form>
</header>
<div class="bar">
  <div class="seg" role="tablist"><button id="tab-town" role="tab" aria-selected="true">Town</button><button id="tab-world" role="tab" aria-selected="false">World</button></div>
  <div class="seg" id="modes"><button id="mode-plan" aria-pressed="true">Street map</button><button id="mode-iso" aria-pressed="false">Isometric</button></div>
  <nav id="crumbs"></nav>
  <div id="progress"></div>
</div>
<main>
  <div class="stage">
    <canvas id="town-canvas"></canvas>
    <canvas id="world-canvas"></canvas>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit" title="Fit">⤢</button></div>
  </div>
  <aside><div id="inspector"></div><div id="summary"></div></aside>
</main>
<div class="shelf-wrap"><b>On the map · <span id="shelf-count"></span></b><div id="shelf"></div></div>
<dialog id="settings"><form method="dialog">
  <h3 style="margin-top:0">Settings</h3>
  <p class="muted">Without a token GitHub allows 60 requests an hour from your address. A small repo costs about 8 requests plus raw file reads, which are not counted. A fine-grained token with public read-only access raises the limit to 5,000. It is stored only in this browser.</p>
  <input id="token" type="password" placeholder="GitHub token (optional)" autocomplete="off">
  <menu><button class="ghost" id="clear-cache" value="clear">Clear saved towns</button><button class="ghost" value="cancel">Close</button><button class="btn" id="save-token" value="save">Save token</button></menu>
</form></dialog>
<script>window.GH_SITE_REPO = "Beachkila/GitHoods"; window.GH_WORKER_URL = "https://githoods-relay.kbmallonee.workers.dev";</script>
<script>
/* ---- scanner.js ---- */
/* GitHoods scanner: reads a public repo through GitHub's REST API and raw file host.
   Deterministic: same repo state -> same scan object. No AI. */

const GH = (() => {
  const q = new URLSearchParams(location.search);
  return {
    api: q.get('api') || 'https://api.github.com',
    raw: q.get('raw') || 'https://raw.githubusercontent.com',
  };
})();

const CODE_EXT = {
  py: 'python', pyw: 'python',
  js: 'javascript', mjs: 'javascript', cjs: 'javascript', jsx: 'javascript',
  ts: 'typescript', tsx: 'typescript', mts: 'typescript', cts: 'typescript',
  vue: 'javascript', svelte: 'javascript',
  html: 'html', htm: 'html',
  css: 'css', scss: 'css', sass: 'css', less: 'css',
  go: 'go', rs: 'rust',
  java: 'java', kt: 'kotlin', kts: 'kotlin', scala: 'scala',
  c: 'c', h: 'c', cc: 'cpp', cpp: 'cpp', cxx: 'cpp', hpp: 'cpp', hh: 'cpp', ino: 'cpp',
  cs: 'csharp', fs: 'fsharp', swift: 'swift', m: 'objc', mm: 'objc',
  rb: 'ruby', php: 'php', r: 'r', R: 'r', lua: 'lua', dart: 'dart',
  sh: 'shell', bash: 'shell', zsh: 'shell', ps1: 'shell', bat: 'shell',
  ex: 'elixir', exs: 'elixir', erl: 'erlang', hs: 'haskell', ml: 'ocaml', clj: 'clojure',
  jl: 'julia', nim: 'nim', zig: 'zig', sql: 'sql',
};
const MANIFESTS = ['package.json', 'requirements.txt', 'requirements-dev.txt', 'pyproject.toml', 'Cargo.toml', 'go.mod', 'Gemfile', 'composer.json', 'setup.py'];

function extOf(p) {
  const b = p.split('/').pop();
  const i = b.lastIndexOf('.');
  return i > 0 ? b.slice(i + 1) : '';
}

function ghToken() { try { return localStorage.getItem('gh_token') || ''; } catch (e) { return ''; } }

class ScanError extends Error { constructor(msg, code) { super(msg); this.code = code; } }

async function ghFetch(path) {
  const headers = { Accept: 'application/vnd.github+json' };
  const tok = ghToken(); if (tok) headers.Authorization = 'Bearer ' + tok;
  let res;
  try { res = await fetch(GH.api + path, { headers }); }
  catch (e) { throw new ScanError("Couldn't reach GitHub. Check your connection.", 'network'); }
  if (res.status === 404) throw new ScanError("That repo or owner wasn't found, or it's private.", 'not_found');
  if (res.status === 403 || res.status === 429) {
    const reset = res.headers.get('x-ratelimit-reset');
    const mins = reset ? Math.max(1, Math.ceil((reset * 1000 - Date.now()) / 60000)) : null;
    throw new ScanError('GitHub rate limit reached' + (mins ? `. Try again in about ${mins} min` : '') + ', or add a token in settings.', 'rate');
  }
  if (res.status === 409) return { json: [], headers: res.headers }; // empty repo
  if (!res.ok) throw new ScanError('GitHub returned an error (' + res.status + ').', 'http');
  return { json: await res.json(), headers: res.headers };
}

function lastPageCount(headers, fallback) {
  const link = headers.get('link') || headers.get('Link');
  if (!link) return fallback;
  const m = link.match(/[?&]page=(\d+)[^>]*>;\s*rel="last"/);
  return m ? parseInt(m[1], 10) : fallback;
}

async function countOf(path) {
  try {
    const { json, headers } = await ghFetch(path + (path.includes('?') ? '&' : '?') + 'per_page=1');
    return lastPageCount(headers, Array.isArray(json) ? json.length : 0);
  } catch (e) { if (e.code === 'rate') throw e; return null; }
}

async function fetchRaw(owner, repo, branch, path) {
  const url = `${GH.raw}/${owner}/${repo}/${encodeURIComponent(branch)}/${path.split('/').map(encodeURIComponent).join('/')}`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.text();
  } catch (e) { return null; }
}

async function pool(items, n, fn) {
  let i = 0;
  const workers = Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; await fn(items[k], k); }
  });
  await Promise.all(workers);
}

/* ---------- import parsing ---------- */
function parseImports(lang, path, text) {
  const out = [];
  const add = (s) => { if (s && out.length < 400) out.push(s.trim()); };
  let m;
  if (lang === 'python') {
    const re1 = /^[ \t]*import[ \t]+([\w.]+(?:[ \t]*,[ \t]*[\w.]+)*)/gm;
    while ((m = re1.exec(text))) m[1].split(',').forEach((s) => add(s.trim().split(/\s+as\s+/)[0]));
    const re2 = /^[ \t]*from[ \t]+(\.*[\w.]*)[ \t]+import[ \t]+(\([^)]*\)|[^\n]*)/gm;
    while ((m = re2.exec(text))) {
      const mod = m[1];
      add(mod);
      if (mod.startsWith('.')) m[2].replace(/#[^\n]*/g, '').replace(/[()\\]/g, ' ').split(',').map((s) => s.trim().split(/\s+as\s+/)[0].trim()).filter((s) => /^\w+$/.test(s)).slice(0, 20)
        .forEach((nm) => add((mod.endsWith('.') ? mod : mod + '.') + nm));
    }
  } else if (lang === 'javascript' || lang === 'typescript') {
    const re = /^[ \t]*(?:import|export)\s[^'"`;]*?from\s*['"]([^'"\n]+)['"]|^[ \t]*import\s*['"]([^'"\n]+)['"]|(?<![\w$.])require\(\s*['"]([^'"\n]+)['"]\s*\)|(?<![\w$.])import\(\s*['"]([^'"\n]+)['"]\s*\)/gm;
    while ((m = re.exec(text))) { const v = m[1] || m[2] || m[3] || m[4]; if (!/[\s,$`]/.test(v)) add(v); }
  } else if (lang === 'html') {
    const re = /<script[^>]+src=["']([^"']+)["']|<link[^>]+href=["']([^"']+\.css[^"']*)["']/gi;
    while ((m = re.exec(text))) add(m[1] || m[2]);
    const re2 = /<script[^>]*>([\s\S]*?)<\/script>/gi; // inline module imports
    while ((m = re2.exec(text))) {
      const r3 = /import\s[^'"`;]*?from\s*['"]([^'"]+)['"]/g; let k;
      while ((k = r3.exec(m[1]))) add(k[1]);
    }
  } else if (lang === 'go') {
    const block = /import\s*\(([\s\S]*?)\)/g;
    while ((m = block.exec(text))) { const r = /"([^"]+)"/g; let k; while ((k = r.exec(m[1]))) add(k[1]); }
    const single = /import\s+(?:\w+\s+)?"([^"]+)"/g;
    while ((m = single.exec(text))) add(m[1]);
  } else if (lang === 'rust') {
    const re = /^\s*(?:pub\s+)?use\s+([\w:]+)/gm;
    while ((m = re.exec(text))) add(m[1]);
    const re2 = /^\s*(?:pub\s+)?mod\s+(\w+)\s*;/gm;
    while ((m = re2.exec(text))) add('mod::' + m[1]);
    const re3 = /^\s*extern\s+crate\s+(\w+)/gm;
    while ((m = re3.exec(text))) add(m[1]);
  } else if (lang === 'java' || lang === 'kotlin' || lang === 'scala') {
    const re = /^\s*import\s+(?:static\s+)?([\w.]+)/gm;
    while ((m = re.exec(text))) add(m[1]);
  } else if (lang === 'c' || lang === 'cpp' || lang === 'objc') {
    const re = /^\s*#\s*(?:include|import)\s*([<"])([^>"]+)[>"]/gm;
    while ((m = re.exec(text))) add((m[1] === '"' ? '"' : '<') + m[2]);
  } else if (lang === 'ruby') {
    const re = /^\s*require(_relative)?\s*\(?\s*['"]([^'"]+)['"]/gm;
    while ((m = re.exec(text))) add((m[1] ? './' : '') + m[2]);
  } else if (lang === 'php') {
    const re = /^\s*use\s+([\w\\]+)/gm;
    while ((m = re.exec(text))) add(m[1]);
    const re2 = /(?:require|include)(?:_once)?\s*\(?\s*['"]([^'"]+)['"]/g;
    while ((m = re2.exec(text))) add('./' + m[1]);
  } else if (lang === 'swift') {
    const re = /^\s*import\s+(\w+)/gm;
    while ((m = re.exec(text))) add(m[1]);
  } else if (lang === 'csharp' || lang === 'fsharp') {
    const re = /^\s*(?:using|open)\s+([\w.]+)\s*;?/gm;
    while ((m = re.exec(text))) add(m[1]);
  } else if (lang === 'r') {
    const re = /(?:library|require)\(\s*['"]?([\w.]+)['"]?\s*\)|source\(\s*['"]([^'"]+)['"]/g;
    while ((m = re.exec(text))) add(m[1] || ('./' + m[2]));
  } else if (lang === 'lua') {
    const re = /require\s*\(?\s*['"]([^'"]+)['"]/g;
    while ((m = re.exec(text))) add(m[1]);
  } else if (lang === 'dart') {
    const re = /^\s*import\s+['"]([^'"]+)['"]/gm;
    while ((m = re.exec(text))) add(m[1]);
  } else if (lang === 'css') {
    const re = /@import\s+(?:url\()?['"]?([^'")\s;]+)/g;
    while ((m = re.exec(text))) add(m[1]);
  }
  return out;
}

const ROUTE_RE = /@(?:app|router|bp|api)\.(?:get|post|put|delete|patch|route)\(|\b(?:app|router)\.(?:get|post|put|delete|patch)\(\s*['"`]|HandleFunc\(|\.path\s*==\s*['"]|@(?:Get|Post|Put|Delete)Mapping/g;

function fileMetrics(text) {
  const lines = text.length ? text.split('\n').length : 0;
  const count = (re) => (text.match(re) || []).length;
  return {
    lines,
    routes: count(ROUTE_RE),
    canvas: /getContext\(|<canvas|\bcanvas\b/.test(text) ? 1 : 0,
    gpio: count(/\bgpio\b|GPIO|gpiozero|RPi\b/g) > 2 ? 1 : 0,
    storage: /localStorage|sessionStorage|indexedDB/.test(text) ? 1 : 0,
    fetchLocal: count(/\bfetch\(\s*['"`]\/(?!\/)|\baxios\.\w+\(\s*['"`]\/(?!\/)|XMLHttpRequest/g),
    classes: count(/^\s*(?:export\s+)?(?:abstract\s+)?(?:class|struct|interface)\s+\w/gm),
    fns: count(/\bfunction\b|\bdef\s+\w|\bfn\s+\w|\bfunc\s+\w|=>\s*[{(]/g),
  };
}

/* ---------- manifests ---------- */
function parseManifest(name, text) {
  const deps = {}; // name -> 'run' | 'dev'
  const put = (n, k) => { n = (n || '').trim(); if (n && !deps[n]) deps[n] = k; };
  try {
    if (name === 'package.json') {
      const j = JSON.parse(text);
      Object.keys(j.dependencies || {}).forEach((n) => put(n, 'run'));
      Object.keys(j.peerDependencies || {}).forEach((n) => put(n, 'run'));
      Object.keys(j.devDependencies || {}).forEach((n) => put(n, 'dev'));
      return { deps, pkgName: j.name || null, workspaces: j.workspaces || null };
    }
    if (name.startsWith('requirements')) {
      text.split('\n').forEach((l) => { const m = l.trim().match(/^([A-Za-z0-9_.\-]+)/); if (m && !l.trim().startsWith('#') && !l.trim().startsWith('-')) put(m[1], name.includes('dev') ? 'dev' : 'run'); });
    } else if (name === 'pyproject.toml') {
      const arr = text.match(/dependencies\s*=\s*\[([\s\S]*?)\]/);
      if (arr) (arr[1].match(/["']([A-Za-z0-9_.\-]+)/g) || []).forEach((s) => put(s.slice(1), 'run'));
      const poetry = text.match(/\[tool\.poetry\.dependencies\]([\s\S]*?)(\n\[|$)/);
      if (poetry) poetry[1].split('\n').forEach((l) => { const m = l.match(/^([A-Za-z0-9_.\-]+)\s*=/); if (m && m[1] !== 'python') put(m[1], 'run'); });
    } else if (name === 'Cargo.toml') {
      const sec = /\[(dev-|build-)?dependencies\]([\s\S]*?)(?=\n\[|$)/g; let m;
      while ((m = sec.exec(text))) m[2].split('\n').forEach((l) => { const k = l.match(/^([A-Za-z0-9_\-]+)\s*=/); if (k) put(k[1], m[1] ? 'dev' : 'run'); });
      const pn = text.match(/\[package\][\s\S]*?name\s*=\s*"([^"]+)"/);
      return { deps, pkgName: pn ? pn[1] : null };
    } else if (name === 'go.mod') {
      const mod = text.match(/^module\s+(\S+)/m);
      const req = text.match(/require\s*\(([\s\S]*?)\)/);
      (req ? req[1].split('\n') : []).forEach((l) => { const k = l.trim().split(/\s+/)[0]; if (k && !k.startsWith('//')) put(k, l.includes('// indirect') ? 'dev' : 'run'); });
      (text.match(/^require\s+(\S+)\s+\S+/gm) || []).forEach((l) => put(l.split(/\s+/)[1], 'run'));
      return { deps, goModule: mod ? mod[1] : null };
    } else if (name === 'Gemfile') {
      (text.match(/^\s*gem\s+['"]([^'"]+)/gm) || []).forEach((l) => put(l.match(/['"]([^'"]+)/)[1], 'run'));
    } else if (name === 'composer.json') {
      const j = JSON.parse(text);
      Object.keys(j.require || {}).forEach((n) => put(n, 'run'));
      Object.keys(j['require-dev'] || {}).forEach((n) => put(n, 'dev'));
    } else if (name === 'setup.py') {
      const arr = text.match(/install_requires\s*=\s*\[([\s\S]*?)\]/);
      if (arr) (arr[1].match(/["']([A-Za-z0-9_.\-]+)/g) || []).forEach((s) => put(s.slice(1), 'run'));
    }
  } catch (e) { /* malformed manifest: ignore */ }
  return { deps };

/* ---------- owner light scan ---------- */
async function scanOwner(owner, onProgress = () => {}) {
  onProgress('Reading owner ' + owner);
  const { json: u } = await ghFetch(`/users/${owner}`);
  const repos = [];
  const pages = Math.min(5, Math.ceil((u.public_repos || 0) / 100) || 1);
  for (let p = 1; p <= pages; p++) {
    const { json } = await ghFetch(`/users/${owner}/repos?per_page=100&sort=created&direction=asc&page=${p}`);
    if (!Array.isArray(json) || !json.length) break;
    json.forEach((r) => repos.push({
      name: r.name, id: r.id, created: r.created_at, size: r.size, lang: r.language,
      stars: r.stargazers_count, fork: !!r.fork, archived: !!r.archived,
    }));
  }
  repos.sort((a, b) => a.id - b.id);
  return { login: u.login, id: u.id, type: u.type, created: u.created_at, publicRepos: u.public_repos, repos, scannedAt: Date.now() };
}

/* ---------- full repo scan ---------- */
const FILE_CAP = 700, BYTE_CAP = 9e6, TREE_DETAIL_CAP = 6000;

async function scanRepo(owner, repo, onProgress = () => {}) {
  onProgress('Reading repo info');
  const { json: meta } = await ghFetch(`/repos/${owner}/${repo}`);
  owner = meta.owner.login; repo = meta.name;
  const branch = meta.default_branch;
  onProgress('Reading languages');
  const { json: languages } = await ghFetch(`/repos/${owner}/${repo}/languages`);
  onProgress('Reading file tree');
  const { json: tree } = await ghFetch(`/repos/${owner}/${repo}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
  const blobs = (tree.tree || []).filter((t) => t.type === 'blob').map((t) => ({ p: t.path, s: t.size || 0 }));
  blobs.sort((a, b) => (a.p < b.p ? -1 : 1));
  onProgress('Counting history');
  const [commits, contributors, releases] = await Promise.all([
    countOf(`/repos/${owner}/${repo}/commits`),
    countOf(`/repos/${owner}/${repo}/contributors?anon=1`),
    countOf(`/repos/${owner}/${repo}/releases`),
  ]);

  // choose files to read
  const isManifest = (p) => MANIFESTS.includes(p.split('/').pop()) && p.split('/').length <= 3;
  const wanted = blobs.filter((b) => (CODE_EXT[extOf(b.p)] || isManifest(b.p)) && b.s < 250000 && !/(^|\/)(node_modules|vendor|dist|build|\.git)\//.test(b.p) && !/\.min\.(js|css)$/.test(b.p));
  // shallow paths first so every district gets sampled, then by path
  wanted.sort((a, b) => (a.p.split('/').length - b.p.split('/').length) || (a.p < b.p ? -1 : 1));
  const pick = []; let bytes = 0;
  const manifestsFirst = wanted.filter((b) => isManifest(b.p)).concat(wanted.filter((b) => !isManifest(b.p)));
  for (const b of manifestsFirst) { if (pick.length >= FILE_CAP || bytes + b.s > BYTE_CAP) break; pick.push(b); bytes += b.s; }
  const readme = blobs.find((b) => /^readme(\.md|\.markdown|\.rst|\.txt)?$/i.test(b.p));
  if (readme) pick.push(readme);

  const files = {}; // path -> {lang, imp, m}
  const manifests = [];
  let done = 0; let readmeText = null;
  await pool(pick, 12, async (b) => {
    const text = await fetchRaw(owner, repo, branch, b.p);
    done++;
    if (done % 20 === 0 || done === pick.length) onProgress(`Reading files ${done} of ${pick.length}`);
    if (text == null) return;
    if (b === readme) { readmeText = text.slice(0, 150000); return; }
    const name = b.p.split('/').pop();
    if (isManifest(b.p)) { manifests.push({ path: b.p, ...parseManifest(name, text) }); if (!CODE_EXT[extOf(b.p)]) return; }
    const lang = CODE_EXT[extOf(b.p)];
    if (!lang) return;
    files[b.p] = { lang, imp: parseImports(lang, b.p, text), m: fileMetrics(text) };
  });

  // keep the tree compact for very large repos
  let treeOut = blobs, aggregated = false;
  if (blobs.length > TREE_DETAIL_CAP) {
    aggregated = true;
    const agg = new Map();
    for (const b of blobs) {
      const parts = b.p.split('/');
      const key = parts.length > 4 ? parts.slice(0, 4).join('/') + '/*' : b.p;
      const e = agg.get(key) || { p: key, s: 0, n: 0 };
      e.s += b.s; e.n += 1; agg.set(key, e);
    }
    treeOut = [...agg.values()];
  }

  return {
    v: 1,
    owner, repo, id: meta.id, branch,
    meta: {
      stars: meta.stargazers_count, forks: meta.forks_count, openIssues: meta.open_issues_count,
      created: meta.created_at, pushed: meta.pushed_at, archived: !!meta.archived, fork: !!meta.fork,
      parent: meta.parent ? meta.parent.full_name : null, description: meta.description || '',
      ownerType: meta.owner.type, ownerId: meta.owner.id, size: meta.size, private: !!meta.private,
    },
    languages, tree: treeOut, treeCount: blobs.length, aggregated, truncated: !!tree.truncated,
    files, manifests, readme: readmeText,
    counts: { commits, contributors, releases },
    sampled: { read: Object.keys(files).length, eligible: wanted.length },
    scannedAt: Date.now(),
  };
}

    .filter((e) => e.n > 0 || e.declared === 'run' || e.build || e.lm)

    districts: dOut, buildings: buildings.map(slimB), segs, streets: streets.map((s) => ({ name: s.name, traffic: s.traffic, target: s.target, label: s.label, routes: s.routes.map((r) => ({ from: r.from, n: r.n })) })),

function slimB(b) {

  else if (!nonCivic.length && biggest && biggest.lines / totalLines > 0.7) core = 'Single-lot tower';
  else if (!nonCivic.length && imgs >= 3) core = 'Gallery compound';
  else if (!nonCivic.length) core = 'Hamlet';

const LIST_LANGS = [
  ['C', ['c', 'assembly', 'verilog', 'zig']], ['C++', ['c++']], ['Rust', ['rust']], ['Go', ['go']],
  ['Java · C#', ['java', 'c#', 'f#', 'kotlin', 'scala', 'clojure']], ['Others', []], ['Ruby · PHP', ['ruby', 'php']],
  ['JavaScript', ['javascript', 'node.js', 'typescript', 'js']], ['Python', ['python']],

    if (h) { cur = { title: h[1].replace(/[`*_]/g, '').replace(/^Build your own\s+/i, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').trim(), links: [] }; rows.push(cur); continue; }

  }

  const useLang = withLang / linkTotal > 0.4;

    cols = [...dc.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8).map((e) => e[0]); cols.push('Other sites');
  }
  const colOf = (x) => {
    if (useLang) { const f = (x.lang || '').split('/')[0].trim().toLowerCase(); const i = LIST_LANGS.findIndex((c) => c[1].includes(f)); return i < 0 ? 5 : i; }
    const d = domainCol(x.url); const i = cols.indexOf(d); return i < 0 ? cols.length - 1 : i;
  };

    topics = keep;

    if (small.length >= 4) { topics = topics.filter((r) => r.links.length > 2); topics.push({ title: `${small.length} small topics`, links: small.flatMap((r) => r.links), merged: true }); }

  topics.forEach((r, j) => {
    const byCol = new Map(); r.links.forEach((x) => { const c = colOf(x); colTot[c]++; if (!byCol.has(c)) byCol.set(c, []); byCol.get(c).push(x); });

    W, H, bounds: { x0: -1, y0: -1.2, x1: W + 1, y1: H + 2.6 },

    districts: [], buildings, segs: [], streets: [], relations: [], clearings: [], rings: Math.max(1, Math.min(9, Math.round(Math.log2((scan.counts && scan.counts.commits || 1) + 1)))),

    stats: { stars: scan.meta.stars, forks: scan.meta.forks, issues: scan.meta.openIssues, commits: scan.counts ? scan.counts.commits : null, contributors: scan.counts ? scan.counts.contributors : null, files: scan.treeCount, links: linkTotal, kinds, languages: scan.languages, created: scan.meta.created, description: scan.meta.description },

/* ---- world.js ---- */
/* GitHoods world: owners are nations, connected owners share an island, repos are plots granted in creation order. */

/* ---------- model ---------- */
function worldLinks(owners, towns) {
  // Edges between owner logins, with the reason. Deterministic, data-only.
  const byLower = new Map(Object.keys(owners).map((k) => [k.toLowerCase(), k]));
  const repoOwner = new Map(); // repo name (lower) -> owner login, only when unique
  for (const o of Object.values(owners)) for (const r of o.repos) { const k = r.name.toLowerCase(); repoOwner.set(k, repoOwner.has(k) && repoOwner.get(k) !== o.login ? null : o.login); }
  const links = new Map();
  const add = (a, b, why) => { if (!a || !b || a === b) return; const k = [a, b].sort().join('|'); if (!links.has(k)) links.set(k, { a: [a, b].sort()[0], b: [a, b].sort()[1], why: new Set() }); links.get(k).why.add(why); };
  for (const t of Object.values(towns)) {
    const me = byLower.get(t.owner.toLowerCase()); if (!me) continue;
    if (t.parent) { const po = byLower.get(String(t.parent).split('/')[0].toLowerCase()); add(me, po, 'fork'); }
    for (const c of t.clearings || []) {
      const n = c.name.toLowerCase();
      const scope = n.startsWith('@') ? n.slice(1).split('/')[0] : null;
      if (scope && byLower.has(scope)) add(me, byLower.get(scope), 'package');
      const bare = n.replace(/^@[^/]+\//, '');
      const o = repoOwner.get(bare); if (o) add(me, o, 'import');
    }
  }
  return [...links.values()].map((l) => ({ a: l.a, b: l.b, why: [...l.why] }));
}

function worldIslands(owners, links) {
  const ids = Object.keys(owners).sort((a, b) => (owners[a].id || 9e15) - (owners[b].id || 9e15) || a.localeCompare(b));
  const parent = new Map(ids.map((i) => [i, i]));
  const find = (x) => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  for (const l of links) parent.set(find(l.a), find(l.b));
  const groups = new Map();
  for (const i of ids) { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(i); }
  const islands = [...groups.values()].map((members) => {
    const repos = members.reduce((a, m) => a + Math.max(1, owners[m].repos.length), 0);
    const name = members.length === 1 ? members[0] + ' Isle' : members.slice().sort((a, b) => owners[b].repos.length - owners[a].repos.length)[0] + ' Archipelago';
    return { id: members.slice().sort().join('+'), members, repos, name };
  });
  // Deterministic placement: shelf rows ordered by oldest member account id (no spiral).
  islands.sort((a, b) => Math.min(...a.members.map((m) => owners[m].id || 9e15)) - Math.min(...b.members.map((m) => owners[m].id || 9e15)) || a.id.localeCompare(b.id));
  const rOf = (isl) => 3 + 2.2 * Math.sqrt(isl.repos);
  const rowW = Math.max(40, Math.sqrt(islands.reduce((a, i) => a + (2 * rOf(i) + 4) ** 2, 0)) * 1.25);
  let x = 0, y = 0, rowH = 0;
  for (const isl of islands) {
    const r = rOf(isl), R = rng(hashStr(isl.id));
    if (x + 2 * r > rowW && x > 0) { x = 0; y += rowH + 3; rowH = 0; }
    isl.r = r; isl.cx = x + r + R() * 2; isl.cy = y + r + R() * 2;
    const ph = [R() * 6.28, R() * 6.28, R() * 6.28];
    isl.shape = Array.from({ length: 72 }, (_, k) => { const a = (k / 72) * Math.PI * 2; return 1.02 + 0.07 * Math.sin(2 * a + ph[0]) + 0.05 * Math.sin(3 * a + ph[1]) + 0.03 * Math.sin(5 * a + ph[2]); });
    x += 2 * r + 4; rowH = Math.max(rowH, 2 * r + 2);
  }
  return islands;
}

function nationRects(isl, owners) {
  // Treemap of member owners inside the island square, weighted by repo count.
  const s = isl.r * 1.25;
  const items = isl.members.map((m) => ({ v: Math.max(1, owners[m].repos.length), login: m })).sort((a, b) => b.v - a.v || a.login.localeCompare(b.login));
  return squarify(items, isl.cx - s / 2, isl.cy - s / 2, s, s).map((it) => ({ login: it.login, x: it.rect.x, y: it.rect.y, w: it.rect.w, h: it.rect.h }));
}

function plotGrid(owner) {
  const repos = owner.repos.slice().sort((a, b) => (a.id || 0) - (b.id || 0) || a.name.localeCompare(b.name));
  const n = Math.max(1, repos.length), cols = Math.ceil(Math.sqrt(n * 1.3));
  return { cols, rows: Math.ceil(n / cols), plots: repos.map((r, i) => ({ repo: r, c: i % cols, r: Math.floor(i / cols), n: i + 1 })) };
}

/* ---------- view ---------- */
class WorldView {
  constructor(canvas, app) {
    this.cv = canvas; this.ctx = canvas.getContext('2d'); this.app = app;
    this.level = { kind: 'world' }; this.cam = { x: 0, y: 0, z: 10 }; this.hover = null;
    this.fogPat = makeFogPattern(this.ctx);
    this._bind(); new ResizeObserver(() => this.resize()).observe(canvas);
  }
  setData(owners, towns) { this.owners = owners; this.towns = towns; this.links = worldLinks(owners, towns); this.islands = worldIslands(owners, this.links); if (this.level.kind !== 'world' && !this._levelValid()) this.level = { kind: 'world' }; this.fit(); }
  _levelValid() { if (this.level.kind === 'nation') return !!this.owners[this.level.login]; if (this.level.kind === 'island') return this.islands.some((i) => i.id === this.level.id); return true; }
  go(level) { this.level = level; this.hover = null; this.fit(); this.app.onWorldLevel(level); }
  islandOf(login) { return this.islands.find((i) => i.members.includes(login)); }
  resize() { const r = this.cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; this.cv.width = Math.max(1, Math.round(r.width * d)); this.cv.height = Math.max(1, Math.round(r.height * d)); this.dpr = d; this.fit(); }

    if (L.kind === 'world') { if (!this.islands.length) return [0, 0, 40, 30]; const xs = this.islands.flatMap((i) => [i.cx - i.r * 1.3, i.cx + i.r * 1.3]), ys = this.islands.flatMap((i) => [i.cy - i.r * 1.3, i.cy + i.r * 1.6]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; }
    if (L.kind === 'island') { const i = this.islands.find((q) => q.id === L.id); return [i.cx - i.r * 1.25, i.cy - i.r * 1.25, i.cx + i.r * 1.25, i.cy + i.r * 1.35]; }
    const g = plotGrid(this.owners[L.login]); return [-1.2, -2.6, g.cols * 4 + 0.2, g.rows * 4 + 0.6];
  }
  fit() {
    if (!this.dpr || !this.owners) return;
    const [x0, y0, x1, y1] = this._box(); const W = this.cv.width / this.dpr, H = this.cv.height / this.dpr;

    const stat = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
    let html = `<h2><a href="https://github.com/${esc(t.key)}" target="_blank" rel="noopener">${esc(t.key)}</a></h2>
      <p class="arch"><b>${esc(a.name)}</b>${a.traits && a.traits.length ? ' · ' + a.traits.map(esc).join(' · ') : ''}</p>
      ${s.description ? `<p class="desc">${esc(s.description)}</p>` : ''}
      <dl class="stats">${stat('Files', fmt(s.files))}${stat('Lines', fmt(s.lines))}${stat('Imports', fmt(s.imports))}${stat('Stars', fmt(s.stars))}${stat('Commits', fmt(s.commits))}${stat('Contributors', fmt(s.contributors))}</dl>
      ${langBar(s.languages)}`;
    const req = requestUrl(t.key);
    html += t.public ? `<p class="pub">On the public map${t.builtAt ? ` · built ${new Date(t.builtAt).toISOString().slice(0, 10)}` : ''}</p>`
      : t.queued ? `<p class="pub">Sent to the public map. It shows up for everyone in a few minutes.</p>`
      : req ? `<p class="pub local">Only in your browser. <a class="btn small" href="${esc(req)}" target="_blank" rel="noopener">Add to public map</a></p><p class="muted small">Opens a GitHub issue. The map bot rebuilds the town from GitHub and adds it for everyone.</p>` : `<p class="pub local">Only in your browser.</p>`;
    if (t.mode === 'code') {
      html += `<h3>Streets <small>named for the district they lead to, width = import traffic</small></h3><ul class="list">${t.streets.slice(0, 10).map((st) => `<li><span>${esc(st.name)}</span><b>${st.traffic}</b></li>`).join('') || '<li class="muted">No cross-district imports found.</li>'}</ul>
        <h3>Outside the walls <small>external libraries, nearest the district that uses them</small></h3><ul class="list">${t.clearings.map((c) => `<li><span>${esc(c.name)}${c.label ? ` <em>${esc(c.label)}</em>` : ''}${c.trail ? ' <em>build trail</em>' : ''}</span><b>${c.uses}</b></li>`).join('') || '<li class="muted">None.</li>'}</ul>`;
    } else {
      html += `<h3>Grid</h3><p class="muted">Rows are topics and columns are languages. Each house is one link: coral for video, green for a code repo, sand for an article.</p>
        <ul class="list">${t.grid.cols.slice(0, 12).map((c) => `<li><span>${esc(c.name)}</span><b>${c.n}</b></li>`).join('')}</ul>`;
    }
    html += `<h3>History</h3><p class="muted">${t.rings} ring${t.rings === 1 ? '' : 's'} of growth (commits), ${t.visitors.length} visitor${t.visitors.length === 1 ? '' : 's'} (stars), ${t.cranes.length} crane${t.cranes.length === 1 ? '' : 's'} (open issues)${s.created ? `, founded ${esc(s.created.slice(0, 10))}` : ''}.</p>`;
    if (t.notes && t.notes.length) html += `<p class="note">${t.notes.map(esc).join('<br>')}</p>`;
    $('#summary').innerHTML = html;
    $('#inspector').innerHTML = '<p class="muted">Hover or tap a building, district or clearing.</p>';
  }
  function renderInspector(hit, pinned) {
    const el = $('#inspector'); if (!hit) { el.innerHTML = '<p class="muted">Hover or tap a building, district or clearing.</p>'; return; }
    const t = state.current; let h = '';
    if (hit.type === 'building') {
      const b = hit.b;
      if (b.kind.startsWith('link-')) { h = `<h4>${esc(b.name)}</h4><p>${esc(KIND_LABEL[b.kind])} · ${esc(b.topic)} · ${esc(b.col)}</p><p><a href="${esc(b.path)}" target="_blank" rel="noopener">${esc(b.path.length > 60 ? b.path.slice(0, 60) + '…' : b.path)}</a></p>`; }
      else {
        const what = b.landmark ? `${b.landmark.label} (uses ${b.landmark.lib})` : b.special ? SPECIAL_LABEL[b.special] : KIND_LABEL[b.kind] || b.kind;
        h = `<h4>${esc(b.name)}</h4><p class="path">${esc(b.path)}</p><p><b>${esc(what)}</b></p>
          <dl class="stats small"><div><dt>Language</dt><dd>${esc(LANG_NAMES[b.lang] || b.lang || '–')}</dd></div><div><dt>${b.folder ? 'Files' : 'Lines'}</dt><dd>${fmt(b.folder ? b.files : b.lines)}</dd></div><div><dt>Imported by</dt><dd>${b.inDeg || 0}</dd></div><div><dt>Imports</dt><dd>${b.outDeg || 0}</dd></div></dl>`;
        if (!b.folder && t) h += `<p><a href="https://github.com/${esc(t.key)}/blob/HEAD/${esc(b.path)}" target="_blank" rel="noopener">Open file on GitHub</a></p>`;
      }
    } else if (hit.type === 'district') {
      const d = hit.d; h = `<h4>${esc(d.label)}</h4><p class="path">${esc(d.key || '/')}</p><dl class="stats small"><div><dt>Buildings</dt><dd>${d.bcount}</dd></div><div><dt>Files</dt><dd>${fmt(d.files)}</dd></div><div><dt>Lines</dt><dd>${fmt(d.lines)}</dd></div><div><dt>Main language</dt><dd>${esc(LANG_NAMES[d.lang] || d.lang || '–')}</dd></div></dl>`;
    } else if (hit.type === 'clearing') {
      const c = hit.c; h = `<h4>${esc(c.name)}</h4><p><b>${c.label ? esc(c.label) : 'Outside library'}</b>${c.std ? ' · standard library' : ''}${c.trail ? ' · build or dev only' : ''}</p><p>${c.uses} import${c.uses === 1 ? '' : 's'} from this town.</p>`;
    }
    el.innerHTML = h + (pinned ? '<p class="muted">Pinned. Tap empty ground to release.</p>' : '');
  }
  function renderCrumbs() {
    const L = worldView.level, el = $('#crumbs'); const parts = [`<button data-go="world">World</button>`];
    if (L.kind === 'island') parts.push(`<span>${esc(worldView.islands.find((i) => i.id === L.id)?.name || '')}</span>`);
    if (L.kind === 'nation') { const isl = worldView.islandOf(L.login); if (isl && isl.members.length > 1) parts.push(`<button data-go="island:${esc(isl.id)}">${esc(isl.name)}</button>`); parts.push(`<span>${esc(L.login)}</span>`); }
    el.innerHTML = parts.join('<i>›</i>');
  }
  function renderWorldPanel(L) {
    const owners = Object.values(state.owners); const links = worldView.links || [];
    let h;
    if (L.kind === 'nation') {
      const o = state.owners[L.login]; const scanned = o.repos.filter((r) => state.towns[(o.login + '/' + r.name).toLowerCase()]).length;
      const ls = links.filter((l) => l.a === o.login || l.b === o.login);
      h = `<h2><a href="https://github.com/${esc(o.login)}" target="_blank" rel="noopener">${esc(o.login)}</a></h2><p class="arch"><b>${o.type === 'Organization' ? 'Walled nation (organization)' : 'Nation (user)'}</b></p>
        <dl class="stats"><div><dt>Plots</dt><dd>${o.repos.length}</dd></div><div><dt>Towns built</dt><dd>${scanned}</dd></div><div><dt>Stars</dt><dd>${fmt(o.repos.reduce((a, r) => a + (r.stars || 0), 0))}</dd></div></dl>
        <p class="muted">Plots are granted left to right in the order the repos were created. Fogged plots have not been scanned; tap one to build its town.</p>
        <h3>Plots</h3><ul class="list">${o.repos.slice().sort((a, b) => (a.id || 0) - (b.id || 0)).map((r, i) => `<li><button class="link" data-open="${esc(o.login)}/${esc(r.name)}">#${i + 1} ${esc(r.name)}</button><b>${state.towns[(o.login + '/' + r.name).toLowerCase()] ? 'town' : r.fork ? 'fork' : ''}</b></li>`).join('')}</ul>
        ${ls.length ? `<h3>Infrastructure</h3><ul class="list">${ls.map((l) => `<li><span>${esc(l.a === o.login ? l.b : l.a)}</span><b>${esc(l.why.join(', '))}</b></li>`).join('')}</ul>` : ''}`;
    } else {
      h = `<h2>The world</h2><p class="muted">Each owner is a nation. Owners linked by forks or imports share an island; unlinked owners sit on their own isle. Inside each nation, small squares are repo plots in creation order, inked once a town is built. Everything not yet scanned stays in fog.</p>
        <dl class="stats"><div><dt>Nations</dt><dd>${owners.length}</dd></div><div><dt>Islands</dt><dd>${(worldView.islands || []).length}</dd></div><div><dt>Towns</dt><dd>${Object.keys(state.towns).length}</dd></div></dl>
        <h3>Recently built</h3><ul class="list">${Object.values(state.towns).sort((a, b) => (b.builtAt || 0) - (a.builtAt || 0)).slice(0, 12).map((t) => `<li><button class="link" data-town="${esc(t.key.toLowerCase())}">${esc(t.key)}</button><b>${esc(t.archetype ? t.archetype.name : '')}</b></li>`).join('')}</ul>
        <h3>Nations</h3><ul class="list">${owners.map((o) => `<li><button class="link" data-nation="${esc(o.login)}">${esc(o.login)}</button><b>${o.repos.length}</b></li>`).join('')}</ul>
        ${links.length ? `<h3>Infrastructure</h3><ul class="list">${links.map((l) => `<li><span>${esc(l.a)} ↔ ${esc(l.b)}</span><b>${esc(l.why.join(', '))}</b></li>`).join('')}</ul>` : ''}`;
    }
    $('#summary').innerHTML = h; $('#inspector').innerHTML = '<p class="muted">Hover an island, nation or plot.</p>';
  }
  function renderWorldHover(hh) {
    const el = $('#inspector'); if (!hh) { el.innerHTML = '<p class="muted">Hover an island, nation or plot.</p>'; return; }
    if (hh.kind === 'plot') { const o = state.owners[hh.login]; const r = o.repos.find((x) => x.name === hh.repo); const t = state.towns[(hh.login + '/' + hh.repo).toLowerCase()];
      el.innerHTML = `<h4>${esc(hh.repo)}</h4><p>Plot #${hh.n}${r.created ? ' · granted ' + esc(r.created.slice(0, 10)) : ''}</p><p>${t ? `<b>${esc(t.archetype.name)}</b>` : r.size === 0 ? 'Empty plot' : 'Fogged. Tap to scan and build.'}</p>${r.lang ? `<p class="muted">${esc(r.lang)}${r.stars ? ' · ' + fmt(r.stars) + ' stars' : ''}</p>` : ''}`; }
    else { const login = hh.login; const o = login && state.owners[login]; el.innerHTML = o ? `<h4>${esc(login)}</h4><p>${o.type === 'Organization' ? 'Organization' : 'User'} · ${o.repos.length} plots</p>` : ''; }
  }

  /* ---------- wiring ---------- */
  $('#form').addEventListener('submit', (e) => { e.preventDefault(); run($('#q').value); });
  $('#tab-town').onclick = () => setTab('town'); $('#tab-world').onclick = () => setTab('world');
  $('#mode-plan').onclick = () => setMode('plan'); $('#mode-iso').onclick = () => setMode('iso');
  $('#zin').onclick = () => (state.tab === 'town' ? townView : worldView).zoomBy(1.4);
  $('#zout').onclick = () => (state.tab === 'town' ? townView : worldView).zoomBy(1 / 1.4);
  $('#zfit').onclick = () => (state.tab === 'town' ? townView : worldView).fit();
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-go],[data-open],[data-nation],[data-town]'); if (!b) return;
    if (b.dataset.go === 'world') worldView.go({ kind: 'world' });
    else if (b.dataset.go) worldView.go({ kind: 'island', id: b.dataset.go.slice(7) });
    else if (b.dataset.nation) worldView.go({ kind: 'nation', login: b.dataset.nation });
    else if (b.dataset.open) { const [o, r] = b.dataset.open.split('/'); app.openRepo(o, r); }
    else if (b.dataset.town) openKey(b.dataset.town, false);
  });
  const dlg = $('#settings');
  $('#gear').onclick = () => { let tok = ''; try { tok = localStorage.getItem('gh_token') || ''; } catch (e) {} $('#token').value = tok; dlg.showModal(); };
  $('#save-token').onclick = () => { try { const v = $('#token').value.trim(); v ? localStorage.setItem('gh_token', v) : localStorage.removeItem('gh_token'); } catch (e) {} };
  $('#clear-cache').onclick = () => { try { localStorage.removeItem(STORE); } catch (e) {} state.towns = {}; state.owners = {}; load(); loadPublic().then(renderShelf); progress('Cleared towns saved in this browser. Public map towns remain.', 'ok'); };
  function renderShelf() {
    const ts = Object.values(state.towns).sort((a, b) => (b.builtAt || 0) - (a.builtAt || 0));
    $('#shelf-count').textContent = `${ts.length} town${ts.length === 1 ? '' : 's'}`;
    $('#shelf').innerHTML = ts.slice(0, 80).map((t) => `<button data-town="${esc(t.key.toLowerCase())}"${t.public ? '' : ' class="mine" title="Only in your browser"'}>${esc(t.key)}</button>`).join('');
  }

  load(); renderShelf(); setMode('plan');
  (async () => {
    await loadPublic(); renderShelf();
    const hash = decodeURIComponent(location.hash.slice(1));
    if (hash) { if (state.towns[hash.toLowerCase()]) openKey(hash); else { setTab('town'); run(hash); } }
    else if (Object.keys(state.towns).length) setTab('world');
    else setTab('world');
  })();
  window.GitHoods = { state, townView, worldView, run, showTown, setTab, setMode, openKey, ensureTown };
})();

</script>
</body>
</html>
